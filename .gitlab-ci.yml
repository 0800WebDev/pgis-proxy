stages:
  - deploy

deploy_site:
  stage: deploy
  image: node:latest
  script:
    - npm install -g appwrite-cli
    
    # This line is now working!
    - appwrite client --endpoint https://cloud.appwrite.io/v1 --project-id 69f4d43e001852db5970 --key $APPWRITE_API_KEY
    
    # Update --siteId to --site-id
    - appwrite deploy site --site-id 69f4e17f00049568c8df --path ./public --yes
  only:
    - main

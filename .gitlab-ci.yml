stages:
  - deploy

deploy_site:
  stage: deploy
  image: node:latest
  script:
    - npm install -g appwrite-cli
    
    # 1. Login
    - appwrite client --endpoint https://cloud.appwrite.io/v1 --project-id 69f4d43e001852db5970 --key $APPWRITE_API_KEY
    
    # 2. Deploy using the positional ID (No flags needed!)
    # Format: appwrite deploy site [SITE_ID] --path [PATH] --yes
    - appwrite deploy site 69f4e17f00049568c8df --path ./public --yes
  only:
    - main

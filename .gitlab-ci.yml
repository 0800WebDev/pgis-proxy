stages:
  - deploy

deploy_site:
  stage: deploy
  image: node:latest
  script:
    - npm install -g appwrite-cli
    
    # Use --projectId (exactly like this)
    - appwrite client --endpoint https://appwrite.io --projectId 69f4e17f00049568c8df --key $APPWRITE_API_KEY
    
    # Deploy your folder
    - appwrite deploy site --siteId 69f4e17f00049568c8df --path ./public --yes
  only:
    - main

stages:
  - deploy

deploy_site:
  stage: deploy
  image: node:latest
  script:
    - npm install -g appwrite-cli
    
    # 1. Login
    - appwrite client --endpoint https://cloud.appwrite.io/v1 --project-id 69f4d43e001852db5970 --key $APPWRITE_API_KEY
    
    # 2. Deploy Everything
    # The CLI will read the appwrite.json file automatically
    - appwrite deploy site
  only:
    - main

stages:
  - deploy

deploy_site:
  stage: deploy
  image: node:latest
  script:
    - npm install -g appwrite-cli
    
    # Corrected endpoint to the Cloud API
    - appwrite client --endpoint https://appwrite.io --project-id 69f4e17f00049568c8df --key $APPWRITE_API_KEY
    
    # Ensure [YOUR_SITE_ID] is replaced with your actual Site ID
    - appwrite deploy site --siteId 69f4e17f00049568c8df --path ./public --yes
  only:
    - main

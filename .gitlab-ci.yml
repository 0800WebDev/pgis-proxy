stages:
  - deploy

deploy_site:
  stage: deploy
  image: node:latest
  script:
    # 1. Install the CLI
    - npm install -g appwrite-cli
    
    # 2. Log in using your project ID and the Secret Key from your variables
    - appwrite client --endpoint https://appwrite.io --project 69f4e17f00049568c8df --key $APPWRITE_API_KEY
    
    # 3. Push your public folder to the specific Site container
    # REPLACE [YOUR_SITE_ID] with the ID from the Appwrite Sites dashboard
    - appwrite deploy site --siteId 69f4e17f00049568c8df --path ./public --yes
  only:
    - main
